# Fork-only, English-only variant of upstream's publish workflow.
# Drops translation builds and translation reports.
# Keeps the upstream English build pipeline intact.

name: Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        # No fetch-depth: 0 needed here (unlike upstream) — that's only
        # required for build.sh's translation git-restore logic, which we
        # never hit since we only build "en".

      - name: Update Rust
        run: rustup update

      - name: Setup Bazel cache
        uses: ./.github/workflows/setup-bazel-cache

      - name: Setup Rust cache
        uses: ./.github/workflows/setup-rust-cache

      - name: Install mdbook
        uses: ./.github/workflows/install-mdbook

      - name: Build course in English
        run: .github/workflows/build.sh en book

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: book/html

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
